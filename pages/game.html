<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details — IndieHaven</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="../index.html" class="nav-logo">
                    <i class="fa-solid fa-gamepad logo-icon"></i>
                    <span>IndieHaven</span>
                </a>
            </div>
            <div class="nav-right">
                <a href="../index.html" class="btn secondary-btn">Home</a>
                <a href="browse.html" class="btn secondary-btn">Browse Games</a>
            </div>
        </div>
    </nav>

    <main id="gameDetailMain" style="padding-top: 40px; max-width: 1100px;">
        <!-- Dynamically loaded -->
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/games.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id');
            const main = document.getElementById('gameDetailMain');

            const games = await GamesModule.fetchCatalog();
            const game = games.find(g => g.id === gameId);

            if (!game) {
                main.innerHTML = `
                    <div class="empty-state-card">
                        <i class="fa-solid fa-ghost" style="font-size: 3rem; color: var(--accent-main);"></i>
                        <h3>Game Not Found</h3>
                        <p>The game you are looking for does not exist in our library or may have been removed.</p>
                        <a href="../index.html" class="btn primary-btn" style="margin-top: 10px;">Return Home</a>
                    </div>
                `;
                return;
            }

            const coverSrc = `../${game.cover}`;
            const priceText = game.price?.type === 'free' ? 'FREE' : `$${parseFloat(game.price?.amount || 0).toFixed(2)}`;

            // Determine action button based on gameType
            let actionBtn = '';
            if (game.gameType === 'download' && game.downloadUrl) {
                actionBtn = `<a href="${game.downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn primary-btn"><i class="fa-solid fa-download"></i> Download Game</a>`;
            } else if (game.gameType === 'browser' && game.gameUrl) {
                actionBtn = `<a href="${game.gameUrl}" target="_blank" rel="noopener noreferrer" class="btn primary-btn"><i class="fa-solid fa-play"></i> Play in Browser</a>`;
            } else if (game.gameType === 'external' && game.gameUrl) {
                actionBtn = `<a href="${game.gameUrl}" target="_blank" rel="noopener noreferrer" class="btn primary-btn"><i class="fa-solid fa-external-link"></i> Visit Game Page</a>`;
            }

            const screenshotsHTML = game.screenshots && game.screenshots.length > 0 ? `
                <div style="margin-top: 40px;">
                    <h3 style="margin-bottom: 16px;">Screenshots</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
                        ${game.screenshots.map(s => `<img src="../${s}" style="width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">`).join('')}
                    </div>
                </div>
            ` : '';

            main.innerHTML = `
                <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: var(--radius-lg); display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
                    <div>
                        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                            ${(game.genres || []).map(g => `<span style="background: var(--accent-main); color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">${g}</span>`).join('')}
                        </div>
                        <h1 style="font-size: 2.5rem; margin-bottom: 8px;">${game.title}</h1>
                        <p style="color: var(--text-secondary); margin-bottom: 20px;">By <strong>${game.developer || 'Independent'}</strong> &bull; Released: ${game.releaseDate || 'N/A'}</p>
                        <p style="line-height: 1.6; margin-bottom: 30px; color: var(--text-secondary);">${game.description || game.shortDescription || 'No description provided.'}</p>
                        
                        <div style="display: flex; gap: 12px; align-items: center;">
                            ${actionBtn}
                            <span style="font-weight: 700; font-size: 1.2rem; color: var(--accent-secondary); margin-left: 10px;">${priceText}</span>
                        </div>
                    </div>
                    <div>
                        <img src="${coverSrc}" style="width: 100%; height: 260px; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--border-color);" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f'">
                        <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 16px; border-radius: var(--radius-md); margin-top: 20px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px;">
                            <div><strong>Platforms:</strong> ${(game.platforms || []).join(', ')}</div>
                            <div><strong>Tags:</strong> ${(game.tags || []).join(', ')}</div>
                        </div>
                    </div>
                </div>
                ${screenshotsHTML}
            `;
        });
    </script>
</body>
</html>
