<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — IndieHaven</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main style="max-width: 600px; padding-top: 40px;">
        <h2>Platform Settings</h2>
        <p style="color: var(--text-secondary); margin-top: 10px;">Manage your local storage preferences and data.</p>
        <button onclick="localStorage.clear(); alert('Local storage cleared!'); window.location.reload();" class="btn primary-btn" style="margin-top: 20px; background-color: var(--danger);">Reset Local Storage</button>
    </main>
</body>
</html>
