<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — IndieHaven</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; background: var(--bg-main);">
    <div style="background:var(--card-bg); border:1px solid var(--border-color); padding:50px; border-radius:12px; max-width:480px;">
        <i class="fa-solid fa-ghost" style="font-size:3.5rem; color:var(--accent-main); margin-bottom:16px;"></i>
        <h2 style="font-size: 1.75rem; color: #fff;">Page Not Found</h2>
        <p style="color:var(--text-secondary); margin:12px 0 24px;">The page or game package you are looking for does not exist or has been removed.</p>
        <a href="index.html" class="btn primary-btn"><i class="fa-solid fa-house"></i> Return to Discover</a>
    </div>
</body>
</html>
