<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Game — IndieHaven</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main style="max-width: 800px; padding-top: 40px;">
        <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: var(--radius-lg);">
            <h2>Publish a New Indie Game</h2>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Fill out the details below to publish your game locally.</p>
            <form id="uploadGameForm" style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Game Title</label>
                    <input type="text" id="gameTitleInput" required style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Developer / Studio</label>
                    <input type="text" id="gameDevInput" required style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Short Description</label>
                    <input type="text" id="gameDescInput" required style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Full Description</label>
                    <textarea id="gameFullDescInput" rows="4" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;"></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 6px;">Genre</label>
                        <select id="gameGenreSelect" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                            <option value="Action">Action</option>
                            <option value="Adventure">Adventure</option>
                            <option value="Horror">Horror</option>
                            <option value="Simulation">Simulation</option>
                            <option value="Puzzle">Puzzle</option>
                            <option value="Sandbox">Sandbox</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 6px;">Price ($ USD or 0 for Free)</label>
                        <input type="number" id="gamePriceInput" value="0" step="0.01" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                    </div>
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 6px;">Cover Image URL</label>
                    <input type="url" id="gameCoverUrl" placeholder="https://images.unsplash.com/..." required style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 6px;">Download URL</label>
                        <input type="url" id="gameDownloadUrl" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 6px;">Browser Play URL</label>
                        <input type="url" id="gamePlayUrl" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px; color: #fff; border-radius: 6px;">
                    </div>
                </div>
                <button type="submit" class="btn primary-btn" style="padding: 12px; margin-top: 10px;">Publish Game</button>
            </form>
        </div>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/upload.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => UploadModule.initWizard());
    </script>
</body>
</html>
