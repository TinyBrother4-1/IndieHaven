<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details — IndieHaven</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="../index.html" class="nav-logo">
                    <i class="fa-solid fa-gamepad logo-icon"></i>
                    <span>IndieHaven</span>
                </a>
            </div>
            <div class="nav-right">
                <a href="../index.html" class="btn secondary-btn">Home</a>
                <a href="browse.html" class="btn secondary-btn">Browse Games</a>
            </div>
        </div>
    </nav>

    <main id="gameDetailMain" style="padding-top: 40px; max-width: 1000px;">
        <!-- Dynamically loaded -->
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/games.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id');
            const main = document.getElementById('gameDetailMain');

            const games = await GamesModule.fetchCatalog();
            const game = games.find(g => g.id === gameId);

            if (!game) {
                main.innerHTML = `
                    <div class="empty-state-card">
                        <i class="fa-solid fa-ghost" style="font-size: 3rem; color: var(--accent-main);"></i>
                        <h3>Game Not Found</h3>
                        <p>The game you are looking for does not exist in our library.</p>
                        <a href="../index.html" class="btn primary-btn" style="margin-top: 10px;">Return Home</a>
                    </div>
                `;
                return;
            }

            // Correct path resolution for subdirectory GitHub Pages deployment
            const downloadPath = `../${game.download}`;

            main.innerHTML = `
                <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: var(--radius-lg); display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
                    <div>
                        <span style="background: var(--accent-main); color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">${game.genre}</span>
                        <h1 style="font-size: 2.5rem; margin: 12px 0;">${game.title}</h1>
                        <p style="color: var(--text-secondary); margin-bottom: 20px;">Created by <strong>${game.author}</strong> &bull; Added: ${game.added}</p>
                        <p style="line-height: 1.6; margin-bottom: 30px; color: var(--text-secondary);">${game.desc}</p>
                        
                        <div style="display: flex; gap: 12px;">
                            <a href="${downloadPath}" download class="btn primary-btn"><i class="fa-solid fa-download"></i> Download Archive (.7z)</a>
                        </div>
                    </div>
                    <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center;">
                        <i class="fa-solid fa-file-zipper" style="font-size: 4rem; color: var(--accent-main); margin-bottom: 16px;"></i>
                        <h3 style="font-size: 1.1rem; margin-bottom: 6px;">Archive Package</h3>
                        <p style="color: var(--text-secondary); font-size: 0.85rem; word-break: break-all;">${game.download}</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
