<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');
        const main = document.getElementById('gameDetailMain');

        const games = await GamesModule.fetchCatalog();
        const game = games.find(g => g.id === gameId);

        if (!game) { /* ... error handling ... */ return; }

        const downloadPath = GamesModule.getAssetPath(game.download);
        const fullDescHTML = GamesModule.formatDescription(game.desc);

        main.innerHTML = `
            <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 45px; border-radius: var(--radius-lg); display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
                <div>
                    <span class="genre-pill">${game.genre}</span>
                    <h1 style="font-size: 2.5rem; font-weight: 800; color: #fff; margin: 12px 0;">${game.title}</h1>
                    <p style="color: var(--text-secondary); margin-bottom: 20px;">Created by <strong>${game.author}</strong> &bull; Added: ${game.added}</p>
                    
                    <div class="game-full-description" style="color: var(--text-secondary); margin-bottom: 30px; font-size: 1.05rem;">
                        ${fullDescHTML}
                    </div>
                    
                    <div style="display: flex; gap: 12px;">
                        <a href="${downloadPath}" download class="btn primary-btn" style="padding: 12px 24px; font-size: 1rem;"><i class="fa-solid fa-download"></i> Download Archive (.7z)</a>
                    </div>
                </div>
                <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;">
                    <i class="fa-solid fa-file-zipper" style="font-size: 4.5rem; color: var(--accent-main); margin-bottom: 16px;"></i>
                    <h3 style="font-size: 1.1rem; color: #fff; margin-bottom: 6px;">Repository Package</h3>
                    <p style="color: var(--text-secondary); font-size: 0.8rem; word-break: break-all;">${game.download}</p>
                </div>
            </div>

            <div id="commentsWrapper"></div>
        `;
        
        // ... rest of Utterances comments logic ...
    });
</script>
